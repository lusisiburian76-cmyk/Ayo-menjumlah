<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AYO MENJUMLAH</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SAMPUL -->
    <section id="cover" class="screen">

        <div class="cover-objects">
            <span>🍎</span>
            <span>🍌</span>
            <span>⚽</span>
        </div>

        <h1>AYO MENJUMLAH</h1>

        <button id="startButton" class="big-button">
            ▶
        </button>

    </section>


    <!-- PERMAINAN -->
    <section id="game" class="screen hidden">

        <div id="levelIndicator"></div>

        <div id="questionArea">

            <!-- LEVEL 1 -->
            <div id="singleGroup"></div>

            <!-- LEVEL 2–4 -->
            <div id="additionArea" class="hidden">

                <div id="group1" class="object-group"></div>

                <div id="plus">+</div>

                <div id="group2" class="object-group"></div>

            </div>

        </div>


        <!-- JAWABAN -->
        <div id="answers"></div>


        <!-- NEXT -->
        <button id="nextButton" disabled>
            ▶
        </button>

    </section>


    <!-- SELESAI -->
    <section id="finish" class="screen hidden">

        <div class="finish-picture">
            🎉
        </div>

        <button id="restartButton" class="big-button">
            ↻
        </button>

    </section>


    <script src="script.js"></script>

</body>
</html>
